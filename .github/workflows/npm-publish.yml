name: Publish to npm

on:
  push:
    tags:
      - "v*"
      - "npm-v*"

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [ci]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm install --no-save @rolldown/binding-linux-x64-gnu@1.1.0
      - run: npm run build

      - name: Dry run — verify package contents
        working-directory: packages/typescript
        run: npm pack --dry-run

      - name: Publish
        working-directory: packages/typescript
        run: npm publish --provenance --access public
