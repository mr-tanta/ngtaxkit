name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
      - "py-v*"

jobs:
  test-python:
    name: Test Python (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: packages/python/pyproject.toml

      - name: Verify packaged rate data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path.cwd()
          shared_dir = root / "shared" / "rates"
          python_dir = root / "packages" / "python" / "src" / "ngtaxkit" / "data" / "rates"
          failures = []

          for shared_path in sorted(shared_dir.glob("*.json")):
              python_path = python_dir / shared_path.name
              if json.loads(shared_path.read_text()) != json.loads(python_path.read_text()):
                  failures.append(shared_path.name)

          if failures:
              raise SystemExit(f"Python packaged rate data is out of sync for: {', '.join(failures)}")

          print("Shared and Python packaged rate data are in sync.")
          PY

      - name: Install Python package
        working-directory: packages/python
        run: python -m pip install -e ".[dev]"

      - name: Lint Python package and tests
        working-directory: packages/python
        run: python -m ruff check src/ tests/ ../../scripts/smoke/python-installed.py

      - name: Type check Python package
        working-directory: packages/python
        run: python -m mypy --strict src/

      - name: Run pytest
        working-directory: packages/python
        run: pytest -v

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [test-python]
    permissions:
      contents: read
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/ngtaxkit/
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build sdist and wheel
        working-directory: packages/python
        run: python -m build

      - name: Smoke test installed wheel
        run: |
          python -m venv "$RUNNER_TEMP/python-smoke"
          "$RUNNER_TEMP/python-smoke/bin/python" -m pip install packages/python/dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/python-smoke/bin/python" "$GITHUB_WORKSPACE/scripts/smoke/python-installed.py"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/python/dist/
