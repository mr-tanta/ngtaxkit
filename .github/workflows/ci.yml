name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm install --no-save @rolldown/binding-linux-x64-gnu@1.1.0
      - run: npm run verify:rates
      - run: npm run build
      - run: npm run type-check --workspace @ngtaxkit/core
      - run: npm run type-check --workspace ngtaxkit

  test-typescript:
    name: Test TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm install --no-save @rolldown/binding-linux-x64-gnu@1.1.0
      - run: npm run verify:rates
      - run: npm run build
      - run: npm run test --workspace @ngtaxkit/core
      - run: npm run test --workspace ngtaxkit

  test-python:
    name: Test Python (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: packages/python/pyproject.toml

      - run: npm ci
      - run: npm install --no-save @rolldown/binding-linux-x64-gnu@1.1.0
      - run: npm run verify:rates
      - run: npm run build

      - name: Install Python package
        working-directory: packages/python
        run: pip install -e ".[dev]"

      - name: Run pytest
        working-directory: packages/python
        run: pytest -v

  artifact-smoke:
    name: Installed Artifact Smoke
    runs-on: ubuntu-latest
    needs: [typecheck, test-typescript, test-python]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/python/pyproject.toml

      - run: npm ci
      - run: npm install --no-save @rolldown/binding-linux-x64-gnu@1.1.0
      - run: npm run verify:rates
      - run: npm run build

      - name: Pack npm package
        working-directory: packages/typescript
        run: npm pack --pack-destination "$RUNNER_TEMP"

      - name: Smoke test installed npm package
        run: |
          mkdir "$RUNNER_TEMP/npm-smoke"
          cd "$RUNNER_TEMP/npm-smoke"
          npm init -y
          npm install "$RUNNER_TEMP"/ngtaxkit-*.tgz --omit=optional --no-audit --no-fund
          node "$GITHUB_WORKSPACE/scripts/smoke/npm-installed.mjs"

      - name: Build Python wheel
        working-directory: packages/python
        run: |
          python -m pip install build
          python -m build --wheel

      - name: Smoke test installed Python wheel
        run: |
          python -m venv "$RUNNER_TEMP/python-smoke"
          "$RUNNER_TEMP/python-smoke/bin/python" -m pip install packages/python/dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/python-smoke/bin/python" "$GITHUB_WORKSPACE/scripts/smoke/python-installed.py"

  bundle-size:
    name: Bundle Size Check
    runs-on: ubuntu-latest
    needs: [test-typescript]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm install --no-save @rolldown/binding-linux-x64-gnu@1.1.0
      - run: npm run verify:rates
      - run: npm run build

      - name: Check bundle size
        run: |
          BUNDLE=packages/typescript/dist/index.mjs
          if [ ! -f "$BUNDLE" ]; then
            BUNDLE=packages/typescript/dist/index.js
          fi
          RAW=$(wc -c < "$BUNDLE")
          GZIP=$(gzip -c "$BUNDLE" | wc -c)
          echo "Raw: ${RAW} bytes"
          echo "Gzipped: ${GZIP} bytes"
          if [ "$GZIP" -gt 51200 ]; then
            echo "::error::Bundle size ${GZIP} bytes exceeds 50KB gzipped limit"
            exit 1
          fi
          echo "Bundle size OK: ${GZIP} bytes gzipped (limit: 51200)"
